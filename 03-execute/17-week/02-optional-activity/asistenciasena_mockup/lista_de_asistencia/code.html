<script>
        // Populate more rows for scrollability demonstration
        const extraRowsContainer = document.getElementById('extra-rows');
        const names = ["Isabella Marin", "Juan Pablo Arias", "Sofia Lopez", "Mateo Valencia", "Valeria Rojas"];
        const ids = ["10001", "10002", "10003", "10004", "10005"];
        
        names.forEach((name, i) => {
            const row = document.createElement('div');
            row.className = "bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex items-center gap-md mt-sm attendance-row-transition hover:bg-surface-container-low shadow-sm";
            row.innerHTML = `
                <div class="w-12 h-12 rounded-full overflow-hidden bg-surface-container-high shrink-0">
                    <img src="placeholder" data-alt="Close-up face of a student, ${name}, looking ahead with a neutral, professional expression. The background is a brightly lit vocational classroom with technical diagrams. The style is modern, professional, and captures the academic environment of SENA." class="w-full h-full object-cover">
                </div>
                <div class="flex-grow min-w-0">
                    <p class="font-label-lg text-label-lg text-on-surface truncate">${name}</p>
                    <p class="font-label-md text-label-md text-outline truncate">ID: 109${ids[i]}223</p>
                </div>
                <div class="flex items-center gap-xs shrink-0">
                    <button class="w-10 h-10 rounded-lg border border-outline-variant text-outline font-bold flex items-center justify-center hover:bg-surface-variant transition-colors">P</button>
                    <button class="w-10 h-10 rounded-lg border border-outline-variant text-outline font-bold flex items-center justify-center hover:bg-surface-variant transition-colors">A</button>
                    <button class="w-10 h-10 rounded-lg border border-outline-variant text-outline font-bold flex items-center justify-center hover:bg-surface-variant transition-colors">T</button>
                    <button class="w-10 h-10 rounded-lg border border-outline-variant text-outline font-bold flex items-center justify-center hover:bg-surface-variant transition-colors">J</button>
                </div>
            `;
            extraRowsContainer.appendChild(row);
        });

        // Simple button toggle logic for demonstration
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn || !btn.parentElement.classList.contains('shrink-0')) return;
            
            const row = btn.closest('.flex-items-center');
            const buttons = btn.parentElement.querySelectorAll('button');
            
            buttons.forEach(b => {
                b.classList.remove('bg-attendance-present', 'bg-attendance-absent', 'bg-attendance-late', 'bg-attendance-justified', 'text-white');
                b.classList.add('border-outline-variant', 'text-outline');
            });

            btn.classList.remove('border-outline-variant', 'text-outline');
            const type = btn.innerText;
            if (type === 'P') btn.classList.add('bg-attendance-present', 'text-white');
            if (type === 'A') btn.classList.add('bg-attendance-absent', 'text-white');
            if (type === 'T') btn.classList.add('bg-attendance-late', 'text-white');
            if (type === 'J') btn.classList.add('bg-attendance-justified', 'text-white');
        });
    </script>
