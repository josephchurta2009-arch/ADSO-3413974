<style>
        .scanner-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 24px;
            overflow: hidden;
        }
        .scanner-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scanner-target {
            width: 70%;
            aspect-ratio: 1/1;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            background: transparent;
        }
        
        .scanner-target::before, .scanner-target::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: #8bfc7c; /* primary-fixed */
            border-style: solid;
        }
        
        .scanner-target::before {
            top: -2px; left: -2px;
            border-width: 4px 0 0 4px;
            border-top-left-radius: 16px;
        }
        .scanner-target::after {
            bottom: -2px; right: -2px;
            border-width: 0 4px 4px 0;
            border-bottom-right-radius: 16px;
        }
        
        .scanner-target .corner-tr, .scanner-target .corner-bl {
             position: absolute;
             width: 32px;
             height: 32px;
             border-color: #8bfc7c;
             border-style: solid;
        }
        .scanner-target .corner-tr {
            top: -2px; right: -2px;
            border-width: 4px 4px 0 0;
            border-top-right-radius: 16px;
        }
        .scanner-target .corner-bl {
            bottom: -2px; left: -2px;
            border-width: 0 0 4px 4px;
            border-bottom-left-radius: 16px;
        }

        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #8bfc7c;
            box-shadow: 0 0 10px #8bfc7c;
            animation: scan 2s linear infinite;
            top: 10%;
        }

        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
        
        /* Toast Animation */
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast-exit {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-exit-active {
            transform: translateY(100%);
            opacity: 0;
            transition: all 200ms cubic-bezier(0.4, 0, 1, 1);
        }
    </style>

<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerBtn = document.getElementById('registerBtn');
            const toast = document.getElementById('successToast');

            registerBtn.addEventListener('click', () => {
                // Change button state
                const originalContent = registerBtn.innerHTML;
                registerBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Registrando...`;
                registerBtn.disabled = true;
                registerBtn.classList.add('opacity-70');

                // Simulate network request
                setTimeout(() => {
                    registerBtn.innerHTML = originalContent;
                    registerBtn.disabled = false;
                    registerBtn.classList.remove('opacity-70');
                    
                    // Show toast
                    toast.classList.remove('hidden');
                    // Trigger reflow
                    void toast.offsetWidth;
                    toast.classList.remove('toast-enter');
                    toast.classList.add('toast-enter-active');

                    // Hide toast after delay
                    setTimeout(() => {
                        toast.classList.remove('toast-enter-active');
                        toast.classList.add('toast-exit-active');
                        
                        setTimeout(() => {
                            toast.classList.add('hidden');
                            toast.classList.remove('toast-exit-active');
                            toast.classList.add('toast-enter');
                        }, 200); // match transition duration
                    }, 3000);

                }, 800);
            });
        });
    </script>
