<img class="h-20 w-auto mb-lg object-contain" data-alt="A clean, modern, professional corporate logo for an educational and institutional organization named SENA. The logo should be isolated on a pure white background, featuring a minimalist design language, utilizing a color palette primarily composed of a vibrant institutional green (#39A935) and deep neutral grays. The overall mood is authoritative, trustworthy, and modern, suitable for a high-end web application header." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgjj4KQHZa0-ajbp3J6vfD976qSogYAJFkrtNjqiRAEfGu2c5yoQRoSY2wBqSUb5AKd25T4idzTRg2BEHTO2VmP-jrjKjKg_ZGIU3kkO_SF2YpsJAvJXa-gJFvwdGNtG9sMoL3MSdTFoVERHp1pGONfoC-LAJBe_WO78T2n7-adU4CYsvK2re_5Osapa_EvJWP1tc5OshMAkdsL3BFhK6xzQzmhPhIwQt6c6iSCRvPYpUJNNFl2Cv24nXlJY6V_7e72j_-0_8IQQ"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center tracking-tight text-balance">Sistema de Gestión de Asistencia</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm text-center">Inicie sesión para acceder a su panel de control</p>
</div>
<form action="#" class="space-y-md" method="POST">
<!-- Usuario Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="usuario">Usuario</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-2.5 bg-surface-container-lowest border border-surface-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container focus:ring-4 focus:ring-primary-container/10 transition-all duration-200" id="usuario" name="usuario" placeholder="Ingrese su documento o correo" required="" type="text"/>
</div>
</div>
<!-- Contraseña Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-2.5 bg-surface-container-lowest border border-surface-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container focus:ring-4 focus:ring-primary-container/10 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between pt-base">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-surface-variant text-primary-container focus:ring-primary-container/20 transition-colors" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors hover:underline underline-offset-4" href="#">¿Recuperar contraseña?</a>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-primary-container hover:bg-[#32962e] text-on-primary font-label-md text-label-md rounded-lg shadow-[0px_1px_3px_rgba(0,0,0,0.05),0px_1px_2px_rgba(0,0,0,0.03)] transition-all duration-200 active:scale-[0.98]" type="submit">
<span>Ingresar</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="mt-xl text-center border-t border-surface-variant pt-lg">
<p class="font-label-md text-label-md text-on-surface-variant/70">

            </p>
