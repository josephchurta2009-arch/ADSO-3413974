<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Esquina - Iniciar Sesión</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="text-center">
                <div class="login-logo">
                    <i class="bi bi-shop"></i>
                </div>
                <h2 class="mb-1 text-brand">La Esquina</h2>
                <p class="text-muted mb-4">Sistema de Gestión</p>
            </div>
            
            <form action="dashboard.html">
                <div class="mb-3">
                    <label for="usuario" class="form-label fw-medium">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0 bg-light" id="usuario" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-medium">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 bg-light" id="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-brand btn-lg py-2">
                        Iniciar sesión <i class="bi bi-box-arrow-in-right ms-2"></i>
                    </button>
                </div>
                <div class="text-center mt-4">
                    <a href="#" class="text-decoration-none text-muted small hover-text-brand">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
