<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="630" fill="#ffffff"/>
  <defs>
    <marker id="genDom" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Rol -->
  <rect x="30" y="35" width="160" height="80" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="30" y1="60" x2="190" y2="60" stroke="#1d4ed8"/>
  <text x="110" y="52" text-anchor="middle" font-size="12" font-weight="bold">Rol</text>
  <text x="40" y="78" font-size="10.5">nombreRol</text>
  <text x="40" y="95" font-size="10.5">descripcionPermisos</text>

  <!-- Usuario -->
  <rect x="260" y="35" width="160" height="80" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="260" y1="60" x2="420" y2="60" stroke="#1d4ed8"/>
  <text x="340" y="52" text-anchor="middle" font-size="12" font-weight="bold">Usuario</text>
  <text x="270" y="78" font-size="10.5">nombre</text>
  <text x="270" y="95" font-size="10.5">estadoCuenta</text>

  <!-- Mesero -->
  <rect x="260" y="170" width="160" height="80" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="260" y1="195" x2="420" y2="195" stroke="#1d4ed8"/>
  <text x="340" y="187" text-anchor="middle" font-size="12" font-weight="bold">Mesero</text>
  <text x="270" y="213" font-size="10.5">codigoTurno</text>
  <text x="270" y="230" font-size="10.5">zonaAsignada</text>

  <!-- Mesa -->
  <rect x="30" y="320" width="165" height="95" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="30" y1="345" x2="195" y2="345" stroke="#1d4ed8"/>
  <text x="112" y="337" text-anchor="middle" font-size="12" font-weight="bold">Mesa</text>
  <text x="40" y="363" font-size="10.5">numeroMesa</text>
  <text x="40" y="380" font-size="10.5">capacidad</text>
  <text x="40" y="397" font-size="10.5">estadoDisponibilidad</text>

  <!-- Pedido -->
  <rect x="265" y="320" width="155" height="95" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="265" y1="345" x2="420" y2="345" stroke="#1d4ed8"/>
  <text x="342" y="337" text-anchor="middle" font-size="12" font-weight="bold">Pedido</text>
  <text x="275" y="363" font-size="10.5">numeroOrden</text>
  <text x="275" y="380" font-size="10.5">fechaHora</text>
  <text x="275" y="397" font-size="10.5">estadoPedido</text>

  <!-- DetallePedido (Clase de asociacion) -->
  <rect x="490" y="215" width="150" height="80" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <line x1="490" y1="240" x2="640" y2="240" stroke="#b45309"/>
  <text x="565" y="232" text-anchor="middle" font-size="12" font-weight="bold">DetallePedido</text>
  <text x="500" y="258" font-size="10.5">cantidad</text>
  <text x="500" y="275" font-size="10.5">observaciones</text>

  <!-- Producto -->
  <rect x="700" y="320" width="160" height="95" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="700" y1="345" x2="860" y2="345" stroke="#1d4ed8"/>
  <text x="780" y="337" text-anchor="middle" font-size="12" font-weight="bold">Producto</text>
  <text x="710" y="363" font-size="10.5">nombre</text>
  <text x="710" y="380" font-size="10.5">precioUnitario</text>
  <text x="710" y="397" font-size="10.5">disponible</text>

  <!-- Categoria -->
  <rect x="700" y="140" width="160" height="80" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="700" y1="165" x2="860" y2="165" stroke="#1d4ed8"/>
  <text x="780" y="157" text-anchor="middle" font-size="12" font-weight="bold">Categoria</text>
  <text x="710" y="183" font-size="10.5">nombreCategoria</text>
  <text x="710" y="200" font-size="10.5">descripcion</text>

  <!-- Insumo -->
  <rect x="700" y="485" width="160" height="95" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="700" y1="510" x2="860" y2="510" stroke="#1d4ed8"/>
  <text x="780" y="502" text-anchor="middle" font-size="12" font-weight="bold">Insumo</text>
  <text x="710" y="528" font-size="10.5">nombreInsumo</text>
  <text x="710" y="545" font-size="10.5">cantidadExistente</text>
  <text x="710" y="562" font-size="10.5">stockMinimo</text>

  <!-- Factura -->
  <rect x="265" y="485" width="155" height="95" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="265" y1="510" x2="420" y2="510" stroke="#1d4ed8"/>
  <text x="342" y="502" text-anchor="middle" font-size="12" font-weight="bold">Factura</text>
  <text x="275" y="528" font-size="10.5">numeroFactura</text>
  <text x="275" y="545" font-size="10.5">fechaEmision</text>
  <text x="275" y="562" font-size="10.5">total</text>

  <!-- Pago -->
  <rect x="30" y="485" width="165" height="95" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="30" y1="510" x2="195" y2="510" stroke="#1d4ed8"/>
  <text x="112" y="502" text-anchor="middle" font-size="12" font-weight="bold">Pago</text>
  <text x="40" y="528" font-size="10.5">metodoPago</text>
  <text x="40" y="545" font-size="10.5">montoRecibido</text>
  <text x="40" y="562" font-size="10.5">fechaPago</text>

  <!-- Associations & Multiplicities -->
  <line x1="190" y1="75" x2="260" y2="75" stroke="#334155" stroke-width="1.4"/>
  <text x="198" y="68" font-size="10">1</text><text x="240" y="68" font-size="10">0..*</text>

  <line x1="340" y1="170" x2="340" y2="120" stroke="#334155" stroke-width="1.4" marker-end="url(#genDom)"/>

  <line x1="340" y1="250" x2="340" y2="320" stroke="#334155" stroke-width="1.4"/>
  <text x="346" y="268" font-size="10">1</text><text x="346" y="312" font-size="10">0..*</text>

  <line x1="195" y1="365" x2="265" y2="365" stroke="#334155" stroke-width="1.4"/>
  <text x="202" y="358" font-size="10">1</text><text x="245" y="358" font-size="10">0..*</text>

  <line x1="420" y1="365" x2="700" y2="365" stroke="#334155" stroke-width="1.4"/>
  <text x="428" y="358" font-size="10">0..*</text><text x="678" y="358" font-size="10">1..*</text>
  <line x1="565" y1="295" x2="565" y2="365" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4,3"/>

  <line x1="780" y1="220" x2="780" y2="320" stroke="#334155" stroke-width="1.4"/>
  <text x="786" y="236" font-size="10">1</text><text x="786" y="312" font-size="10">0..*</text>

  <line x1="780" y1="415" x2="780" y2="485" stroke="#334155" stroke-width="1.4"/>
  <text x="786" y="432" font-size="10">0..*</text><text x="786" y="478" font-size="10">1..*</text>

  <line x1="342" y1="415" x2="342" y2="485" stroke="#334155" stroke-width="1.4"/>
  <text x="348" y="432" font-size="10">1</text><text x="348" y="478" font-size="10">0..1</text>

  <line x1="195" y1="532" x2="265" y2="532" stroke="#334155" stroke-width="1.4"/>
  <text x="202" y="525" font-size="10">1..*</text><text x="250" y="525" font-size="10">1</text>
</svg>